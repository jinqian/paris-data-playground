name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check data files are valid JSON
        run: |
          for f in data/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html reservations.html prets.html assets data .nojekyll _site/
          # Cache-bust: pages reference assets as "?v=dev"; stamp the commit so a
          # new page never runs against a stale cached common.js / data file.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/*.html
          ! grep -l "?v=dev" _site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
